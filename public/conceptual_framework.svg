<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 定義漸變色 -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    
    <!-- 箭頭標記 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto" fill="#2c3e50">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    
    <!-- 陰影濾鏡 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 標題 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="24" font-weight="bold" fill="#2c3e50">
    SVAR 概念架構圖
  </text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="#7f8c8d">
    基於Cholesky識別的四變數結構向量自回歸模型
  </text>
  
  <!-- 變數框 -->
  <!-- 國外假消息威脅 -->
  <rect x="50" y="120" width="180" height="100" rx="15" ry="15" 
        fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="140" y="150" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" font-weight="bold" fill="white">國外假消息威脅</text>
  <text x="140" y="170" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" fill="white">Foreign Disinformation</text>
  <text x="140" y="185" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" fill="white">Threat</text>
  <text x="140" y="205" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="10" fill="rgba(255,255,255,0.8)">v2smfordom</text>
  
  <!-- 社會兩極化 -->
  <rect x="570" y="120" width="180" height="100" rx="15" ry="15" 
        fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="660" y="150" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" font-weight="bold" fill="white">社會兩極化</text>
  <text x="660" y="170" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" fill="white">Polarization of Society</text>
  <text x="660" y="195" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="10" fill="rgba(255,255,255,0.8)">v2smpolsoc</text>
  
  <!-- 管制能力 -->
  <rect x="50" y="380" width="180" height="100" rx="15" ry="15" 
        fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="140" y="410" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" font-weight="bold" fill="white">管制能力</text>
  <text x="140" y="430" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" fill="white">Regulatory Capacity</text>
  <text x="140" y="455" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="10" fill="rgba(255,255,255,0.8)">v2smregcap</text>
  
  <!-- 防衛濫權 -->
  <rect x="570" y="380" width="180" height="100" rx="15" ry="15" 
        fill="url(#grad4)" filter="url(#shadow)"/>
  <text x="660" y="410" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" font-weight="bold" fill="white">防衛濫權</text>
  <text x="660" y="430" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" fill="white">Defense Against Abuse</text>
  <text x="660" y="455" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="10" fill="rgba(255,255,255,0.8)">v2smdefabu</text>
  
  <!-- 結構關係箭頭 (Cholesky順序) -->
  <!-- 國外假消息威脅 → 社會兩極化 -->
  <line x1="230" y1="170" x2="570" y2="170" stroke="#2c3e50" stroke-width="3" 
        marker-end="url(#arrowhead)"/>
  
  <!-- 國外假消息威脅 → 管制能力 -->
  <line x1="140" y1="220" x2="140" y2="380" stroke="#2c3e50" stroke-width="3" 
        marker-end="url(#arrowhead)"/>
  
  <!-- 國外假消息威脅 → 防衛濫權 -->
  <line x1="230" y1="200" x2="570" y2="400" stroke="#2c3e50" stroke-width="3" 
        marker-end="url(#arrowhead)"/>
  
  <!-- 社會兩極化 → 管制能力 -->
  <line x1="570" y1="200" x2="230" y2="400" stroke="#2c3e50" stroke-width="3" 
        marker-end="url(#arrowhead)"/>
  
  <!-- 社會兩極化 → 防衛濫權 -->
  <line x1="660" y1="220" x2="660" y2="380" stroke="#2c3e50" stroke-width="3" 
        marker-end="url(#arrowhead)"/>
  
  <!-- 管制能力 → 防衛濫權 -->
  <line x1="230" y1="430" x2="570" y2="430" stroke="#2c3e50" stroke-width="3" 
        marker-end="url(#arrowhead)"/>
  
  <!-- Cholesky識別順序標示 -->
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" font-weight="bold" fill="#2c3e50">
    Cholesky 識別順序
  </text>
  <text x="100" y="570" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    1. 國外假消息威脅 (最外生)
  </text>
  <text x="300" y="570" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    2. 社會兩極化
  </text>
  <text x="500" y="570" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    3. 管制能力
  </text>
  <text x="650" y="570" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    4. 防衛濫權 (最內生)
  </text>
  
  <!-- 模型假設說明 -->
  <rect x="280" y="280" width="240" height="80" rx="10" ry="10" 
        fill="rgba(255,255,255,0.9)" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="300" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" font-weight="bold" fill="#2c3e50">
    結構假設
  </text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="11" fill="#34495e">
    同期影響僅能單向傳遞
  </text>
  <text x="400" y="335" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="11" fill="#34495e">
    (依Cholesky分解下三角矩陣)
  </text>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="11" fill="#34495e">
    滯後效應允許雙向互動
  </text>
</svg>